<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.P.V Store | Detalhes Baby Look</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; overflow-x: hidden; }
        
        header { background-color: rgba(11, 11, 11, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #1c1c1c; position: sticky; top: 0; z-index: 1000; padding: 1rem 5%; width: 100%; }
        .menu-estrutura { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 1rem; }
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-container img { height: 80px; width: auto; object-fit: contain; }
        
        nav { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .nav-scroll-container { flex-grow: 1; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .nav-scroll-container::-webkit-scrollbar { display: none; }
        .nav-scroll-container { -ms-overflow-style: none; scrollbar-width: none; }
        
        nav ul { display: inline-flex; list-style: none; gap: 1.5rem; }
        nav ul li a { color: #fff; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; padding: 0.4rem 0; display: block; }
        
        .carrinho-topo { color: #fff; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; padding-left: 0.8rem; border-left: 1px solid #1c1c1c; }
        .carrinho-contador { background-color: #25d366; color: white; padding: 2px 8px; border-radius: 50%; font-size: 0.75rem; font-weight: bold; }
        
        .detalhe-produto-container { max-width: 1400px; margin: 4rem auto; padding: 0 6%; display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; }
        .detalhe-imagem-bloco { width: 100%; background-color: #121212; border: 1px solid #1c1c1c; border-radius: 4px; aspect-ratio: 3/4; overflow: hidden; }
        .detalhe-imagem-bloco img { width: 100%; height: 100%; object-fit: cover; }
        .detalhe-info-bloco { position: sticky; top: 160px; }
        .detalhe-nome { font-size: 2.5rem; font-weight: 600; margin-bottom: 1rem; }
        .detalhe-preco { font-size: 1.8rem; font-weight: 600; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid #1c1c1c; }
        .tamanho-seletor { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .tamanho-opcao { background-color: transparent; color: #fff; border: 1px solid #1c1c1c; padding: 0.8rem 1.5rem; font-size: 0.9rem; font-weight: 600; border-radius: 4px; cursor: pointer; flex: 1; min-width: 60px; text-align: center; }
        .tamanho-opcao.selecionado { background-color: #fff; color: #000; border-color: #fff; }
        .btn-adicionar-carrinho { display: block; width: 100%; text-align: center; background-color: #fff; color: #000; padding: 1.2rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; border-radius: 4px; border: none; cursor: pointer; transition: background-color 0.3s; margin-bottom: 1.5rem; }
        .btn-adicionar-carrinho:hover { background-color: #ccc; }
        .btn-voltar { display: block; text-align: center; color: #888; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        
        @media (min-width: 769px) {
            header { padding: 1rem 8%; }
            .menu-estrutura { flex-direction: row; justify-content: space-between; gap: 0; }
            nav { width: auto; }
            .carrinho-topo { padding-left: 1.5rem; }
        }
        @media (max-width: 968px) { .detalhe-produto-container { grid-template-columns: 1fr; gap: 3rem; } .detalhe-info-bloco { position: static; } header { flex-direction: column; gap: 1rem; } .menu-estrutura { flex-direction: column; gap: 1rem; } .carrinho-topo { margin-left: 0; } }
    </style>
</head>
<body>
    <header>
        <div class="menu-estrutura">
            <a href="index.html" class="logo-container"><img src="imagens/logo.png" alt="A.P.V Store"></a>
            <nav>
                <div class="nav-scroll-container">
                    <ul>
                        <li><a href="index.html">Início</a></li>
                        <li><a href="feminino.html">Feminino</a></li>
                        <li><a href="masculino.html">Masculino</a></li>
                        <li><a href="unissex.html">Unissex</a></li>
                        <li><a href="suporte.html">Suporte</a></li>
                    </ul>
                </div>
                <a href="carrinho.html" class="carrinho-topo">🛒 Carrinho <span class="carrinho-contador" id="cart-count">0</span></a>
            </nav>
        </div>
    </header>
    <main class="detalhe-produto-container">
        <section class="detalhe-imagem-bloco"><img src="imagens/foto-produto-f1.webp" alt="Baby Look APV"></section>
        <section class="detalhe-info-bloco">
            <h1 class="detalhe-nome" id="prod-name">Baby Look Atraídos Pela Verdade</h1>
            <p class="detalhe-preco">R$ <span id="prod-price">79.90</span></p>
            <div class="tamanho-seletor">
                <button class="tamanho-opcao" onclick="selecionarTamanho(this)">P</button>
                <button class="tamanho-opcao" onclick="selecionarTamanho(this)">M</button>
                <button class="tamanho-opcao" onclick="selecionarTamanho(this)">G</button>
                <button class="tamanho-opcao" onclick="selecionarTamanho(this)">GG</button>
            </div>
            <button class="btn-adicionar-carrinho" onclick="adicionarAoCarrinho()">Adicionar ao Carrinho</button>
            <a href="index.html" class="btn-voltar">Voltar para a Loja</a>
        </section>
    </main>
    <script>
        let tam = "";
        function selecionarTamanho(b) {
            document.querySelectorAll('.tamanho-opcao').forEach(btn => btn.classList.remove('selecionado'));
            b.classList.add('selecionado');
            tam = b.innerText;
        }
        function adicionarAoCarrinho() {
            if(!tam) { alert("Por favor, selecione um tamanho!"); return; }
            const c = JSON.parse(localStorage.getItem('apv_carrinho')) || [];
            c.push({ nome: document.getElementById('prod-name').innerText, preco: parseFloat(document.getElementById('prod-price').innerText), tamanho: tam });
            localStorage.setItem('apv_carrinho', JSON.stringify(c));
            window.location.href = "carrinho.html";
        }
        function atualizarContador() {
            const carrinho = JSON.parse(localStorage.getItem('apv_carrinho')) || [];
            document.getElementById('cart-count').innerText = carrinho.length;
        }
        window.onload = atualizarContador;
    </script>
</body>
</html>
